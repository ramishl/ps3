name: Publish Crystal PS3
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crystal-ps3-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify installer packages
        run: node .github/scripts/prepare-site.mjs
      - name: Save complete independent website source
        run: |
          git config user.name ramishl
          git config user.email mrr.english.mail@gmail.com
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Add verified HEN installer packages"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
